name: LAVA Canary Regression Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  canary-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y primer3 bioperl libxml-libxml-perl

      - name: Verify primer3_core is in PATH
        run: which primer3_core || echo "primer3_core not found in PATH"

      - name: Run UI Form Names Audit
        run: |
          if [ -f .engine-only ]; then
            echo "Depot moteur seul (.engine-only present) : audit UI hors perimetre."
            exit 0
          fi
          if [ ! -f templates/index.html ]; then
            echo "ERREUR: templates/index.html absent et .engine-only absent." >&2
            exit 1
          fi
          python3 t/test_form_names.py

      - name: Run Flask to Engine Parameter Mapping Audit
        run: |
          if [ -f .engine-only ]; then
            echo "Depot moteur seul (.engine-only present) : audit Flask hors perimetre."
            exit 0
          fi
          if [ ! -f lava_flask_app.py ]; then
            echo "ERREUR: lava_flask_app.py absent et .engine-only absent." >&2
            exit 1
          fi
          python3 t/test_flask_param_mapping.py

      - name: Run Engine Parameters Mapping Audit
        run: python3 t/test_param_mapping.py

      - name: Run Canary Regression Test
        run: |
          export PERL5LIB=$GITHUB_WORKSPACE/lib
          prove -v t/canary_regression.t
